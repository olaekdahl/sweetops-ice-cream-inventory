services:
  postgres:
    image: postgres:16-alpine
    container_name: sweetops-postgres
    environment:
      POSTGRES_DB: ice_cream_inventory
      POSTGRES_USER: sweetops
      POSTGRES_PASSWORD: sweetops_dev_password
    ports:
      - "55437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweetops -d ice_cream_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sweetops-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ice_cream_inventory
      POSTGRES_USER: sweetops
      POSTGRES_PASSWORD: sweetops_dev_password
      CORS_ORIGIN: http://localhost:4317
    ports:
      - "4318:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: sweetops-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:4318/api
    ports:
      - "4317:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

